## Turns on the GRUB SMBIOS cmdline reader for BOOT-TEST images. DANGEROUS, DO
## NOT USE. derivative-maker's build-steps.d/3500_install-packages installs
## this if '--smbios-reader true' is passed. The reader turns a
## firmware-supplied string into kernel command line, and the kernel command
## line is the part of the boot chain Secure Boot does not authenticate. That
## is why it is opt-in rather than merely gated.
GRUB_ENABLE_DM_SMBIOS_READER="true"
