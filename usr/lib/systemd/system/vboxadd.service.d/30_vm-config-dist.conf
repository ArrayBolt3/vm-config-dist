## vboxadd.service is only useful when running inside VirtualBox.
##
## The default timeout of 5 minutes is short enough that building the drivers
## can time out if the host is under heavy load.

[Unit]
ConditionVirtualization=oracle

[Service]
TimeoutSec=20min
